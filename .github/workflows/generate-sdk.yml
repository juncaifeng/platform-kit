name: Generate SDK

on:
  push:
    branches: [master]
    paths:
      - 'proto/kit/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate Go SDK
        run: |
          mkdir -p sdk/generated/go/kit/v1
          protoc \
            --proto_path=proto \
            --go_out=sdk/generated/go \
            --go_opt=paths=source_relative \
            --go-grpc_out=sdk/generated/go \
            --go-grpc_opt=paths=source_relative \
            proto/kit/v1/kit.proto

      - name: Generate Python SDK
        run: |
          pip install grpcio grpcio-tools
          mkdir -p sdk/generated/python/platform_kit/kit/v1
          python -m grpc_tools.protoc \
            --proto_path=proto \
            --python_out=sdk/generated/python \
            --grpc_python_out=sdk/generated/python \
            proto/kit/v1/kit.proto

      - name: Get version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f sdk/generated/
          
          if git diff --cached --quiet; then
            echo "No changes to generated SDK"
            exit 0
          fi
          
          # 提交到 sdk 分支
          git checkout -B sdk
          git commit -m "chore: regenerate SDK ${{ steps.version.outputs.version }} [skip ci]"
          git push origin sdk --force
          
          # 在 master 上打 tag
          git checkout master
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
