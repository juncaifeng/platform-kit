name: Generate SDK

on:
  push:
    branches: [master]
    paths:
      - 'sdk/proto/**'
      - 'sdk/openapi/**'
  pull_request:
    branches: [master]
    paths:
      - 'sdk/proto/**'
      - 'sdk/openapi/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate Go SDK
        run: |
          mkdir -p sdk/generated/go
          
          # Generate health/v1
          protoc \
            --proto_path=sdk/proto \
            --go_out=sdk/generated/go \
            --go_opt=paths=source_relative \
            --go-grpc_out=sdk/generated/go \
            --go-grpc_opt=paths=source_relative \
            sdk/proto/health/v1/health.proto
          
          # Generate metrics/v1
          protoc \
            --proto_path=sdk/proto \
            --go_out=sdk/generated/go \
            --go_opt=paths=source_relative \
            --go-grpc_out=sdk/generated/go \
            --go-grpc_opt=paths=source_relative \
            sdk/proto/metrics/v1/metrics.proto
          
          # Generate service/v1
          protoc \
            --proto_path=sdk/proto \
            --go_out=sdk/generated/go \
            --go_opt=paths=source_relative \
            --go-grpc_out=sdk/generated/go \
            --go-grpc_opt=paths=source_relative \
            sdk/proto/service/v1/service.proto

      - name: Upload generated SDK
        uses: actions/upload-artifact@v4
        with:
          name: sdk-go
          path: sdk/generated/go/

  release:
    needs: generate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download generated SDK
        uses: actions/download-artifact@v4
        with:
          name: sdk-go
          path: sdk/generated/go/

      - name: Get version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            sdk/generated/go/**/*.go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
