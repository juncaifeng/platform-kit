name: Generate SDK

on:
  push:
    branches: [master]
    paths:
      - 'sdk/proto/**'
      - 'sdk/openapi/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate Go SDK
        run: |
          mkdir -p sdk/generated/go
          
          # Generate health/v1
          protoc \
            --proto_path=sdk/proto \
            --go_out=sdk/generated/go \
            --go_opt=paths=source_relative \
            --go-grpc_out=sdk/generated/go \
            --go-grpc_opt=paths=source_relative \
            sdk/proto/health/v1/health.proto
          
          # Generate metrics/v1
          protoc \
            --proto_path=sdk/proto \
            --go_out=sdk/generated/go \
            --go_opt=paths=source_relative \
            --go-grpc_out=sdk/generated/go \
            --go-grpc_opt=paths=source_relative \
            sdk/proto/metrics/v1/metrics.proto
          
          # Generate service/v1
          protoc \
            --proto_path=sdk/proto \
            --go_out=sdk/generated/go \
            --go_opt=paths=source_relative \
            --go-grpc_out=sdk/generated/go \
            --go-grpc_opt=paths=source_relative \
            sdk/proto/service/v1/service.proto

      - name: Commit generated SDK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查是否有变更
          if git diff --quiet sdk/generated/; then
            echo "No changes to generated SDK"
            exit 0
          fi
          
          # 提交到 sdk 分支
          git checkout -B sdk
          git add sdk/generated/
          git commit -m "chore: regenerate SDK from proto [skip ci]"
          git push origin sdk --force
