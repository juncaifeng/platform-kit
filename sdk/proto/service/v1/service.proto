syntax = "proto3";

package platform.service.v1;

option go_package = "github.com/your-org/platform-kit/sdk/generated/go/service/v1;servicev1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// ServiceRegistration 服务注册信息
message ServiceRegistration {
  // 服务名称
  string name = 1;
  
  // 服务地址
  string address = 2;
  
  // 服务端口
  int32 port = 3;
  
  // 服务类型: http | grpc
  string type = 4;
  
  // 健康检查路径
  string health_check_path = 5;
  
  // 网关暴露
  bool gateway_exposed = 6;
  
  // 网关路由前缀
  string gateway_prefix = 7;
  
  // 产生的事件
  repeated string events_produced = 8;
  
  // 消费的事件
  repeated string events_consumed = 9;
  
  // 自定义元数据
  map<string, string> metadata = 10;
}

// ServiceInfo 服务信息
message ServiceInfo {
  // 服务 ID
  string id = 1;
  
  // 服务名称
  string name = 2;
  
  // 服务地址
  string address = 3;
  
  // 服务端口
  int32 port = 4;
  
  // 服务状态: healthy | unhealthy | critical
  string status = 5;
  
  // 注册时间
  google.protobuf.Timestamp registered_at = 6;
  
  // 最后心跳时间
  google.protobuf.Timestamp last_heartbeat = 7;
  
  // 元数据
  map<string, string> metadata = 8;
}

// RegisterRequest 注册请求
message RegisterRequest {
  ServiceRegistration service = 1;
}

// RegisterResponse 注册响应
message RegisterResponse {
  // 服务 ID
  string service_id = 1;
  
  // 是否成功
  bool success = 2;
  
  // 错误信息
  string error = 3;
}

// DeregisterRequest 注销请求
message DeregisterRequest {
  // 服务 ID
  string service_id = 1;
}

// DeregisterResponse 注销响应
message DeregisterResponse {
  // 是否成功
  bool success = 1;
  
  // 错误信息
  string error = 2;
}

// HeartbeatRequest 心跳请求
message HeartbeatRequest {
  // 服务 ID
  string service_id = 1;
}

// HeartbeatResponse 心跳响应
message HeartbeatResponse {
  // 是否成功
  bool success = 1;
  
  // 错误信息
  string error = 2;
}

// ListServicesRequest 列出服务请求
message ListServicesRequest {
  // 过滤条件
  map<string, string> filter = 1;
}

// ListServicesResponse 列出服务响应
message ListServicesResponse {
  // 服务列表
  repeated ServiceInfo services = 1;
}

// ServiceRegistry 服务注册接口
service ServiceRegistry {
  // Register 注册服务
  rpc Register(RegisterRequest) returns (RegisterResponse);
  
  // Deregister 注销服务
  rpc Deregister(DeregisterRequest) returns (DeregisterResponse);
  
  // Heartbeat 心跳
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  
  // ListServices 列出服务
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  
  // GetService 获取服务详情
  rpc GetService(DeregisterRequest) returns (ServiceInfo);
}
